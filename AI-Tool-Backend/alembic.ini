[alembic]
script_location = alembic

# sqlalchemy.url is intentionally NOT set here -- it's read from
# settings.DATABASE_URL at runtime in alembic/env.py instead, so the same
# .env file used by the app is the single source of truth (no duplicated
# connection string to keep in sync).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
